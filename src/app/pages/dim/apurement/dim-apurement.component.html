<div *ngIf="dossier">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
    <button nz-button (click)="annuler()"><span nz-icon nzType="arrow-left"></span> Retour</button>
    <h2 style="margin:0;">Apurement - {{ dossier.numeroDomiciliation }}</h2>
  </div>

  <nz-alert
    nzType="warning"
    nzMessage="Attention : L'apurement est une opération irréversible. Vérifiez l'exhaustivité des documents avant de confirmer."
    nzShowIcon
    style="margin-bottom:24px;">
  </nz-alert>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
    <!-- Checklist -->
    <nz-card nzTitle="Checklist des documents d'apurement">
      <div style="margin-bottom:16px;">
        <nz-progress [nzPercent]="progress" nzStatus="active"></nz-progress>
      </div>
      <nz-table [nzData]="checklist" [nzShowPagination]="false" nzSize="small">
        <thead>
          <tr>
            <th>Document</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of checklist">
            <td>{{ item.document }}</td>
            <td>
              <nz-tag [nzColor]="getCheckStatutColor(item.statut)">{{ item.statut }}</nz-tag>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </nz-card>

    <!-- Apurement Form -->
    <nz-card nzTitle="Saisie d'apurement">
      <form nz-form [formGroup]="apurementForm" nzLayout="vertical">
        <nz-form-item>
          <nz-form-label nzRequired>Date d'apurement</nz-form-label>
          <nz-form-control nzErrorTip="Date requise">
            <nz-date-picker formControlName="dateApurement" style="width:100%;"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Montant apuré (FCFA)</nz-form-label>
          <nz-form-control nzErrorTip="Montant requis">
            <nz-input-number
              formControlName="montantApure"
              style="width:100%;"
              [nzMin]="0"
              [nzStep]="100000"
              nzPlaceHolder="Saisir le montant">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Référence document douanier</nz-form-label>
          <nz-form-control nzErrorTip="Référence requise">
            <input nz-input formControlName="refDocDouane" placeholder="Ex: DUM-2024-ABIDJAN-001" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label>Observations</nz-form-label>
          <nz-form-control>
            <textarea nz-input formControlName="observations" [nzAutosize]="{ minRows: 3, maxRows: 5 }" placeholder="Observations éventuelles..."></textarea>
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-card>
  </div>

  <!-- Action Bar -->
  <div style="margin-top:24px;display:flex;justify-content:flex-end;gap:16px;">
    <button nz-button nzSize="large" (click)="annuler()">Annuler</button>
    <button nz-button nzType="primary" nzSize="large"
      nz-popconfirm
      nzPopconfirmTitle="Confirmer l'apurement de ce dossier ?"
      nzOkText="Confirmer"
      nzCancelText="Annuler"
      (nzOnConfirm)="confirmer()"
      [disabled]="apurementForm.invalid">
      <span nz-icon nzType="check-circle"></span> Confirmer l'apurement
    </button>
  </div>
</div>
